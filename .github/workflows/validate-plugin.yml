name: Validate production plugin package

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR supersedes the older run; every main commit runs to completion.
# No paths filter: the package is mostly Markdown, and that Markdown is what the checks validate.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifests and skills
        run: python3 scripts/check-production-plugin.py
      - name: Check connection policy regressions
        run: python3 scripts/test_production_plugin.py
